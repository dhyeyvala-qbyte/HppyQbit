<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b1020; --panel: #121a2f; --text: #eaf2ff; --muted: #8fa3c9; --accent: #6ea8fe; --good: #22c55e; --warn: #f59e0b; --bad: #ef4444; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: radial-gradient(1200px 800px at 70% -10%, #1a2450 0%, #0b1020 60%); color: var(--text); }
    header { padding: 24px; text-align: center; }
    h1 { margin: 0; font-weight: 800; letter-spacing: -0.02em; font-size: 28px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; backdrop-filter: blur(8px); box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
    .panel { padding: 16px; }
    .video-wrap { position: relative; }
    video, canvas { width: 100%; border-radius: 12px; display: block; }
    canvas { position: absolute; left: 0; top: 0; }
    .controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    button, select { background: #1e2a4a; color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    button:hover { background: #253155; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .kpi { padding: 12px; border-radius: 12px; background: #121a2f; border: 1px solid rgba(255,255,255,0.06); }
    .kpi h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi .val { font-size: 22px; font-weight: 800; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script defer type="module" src="/static/script.js"></script>
</head>
<body>
  <header>
    <h1>Realtime Mood Tracker</h1>
    <div style="color: var(--muted); margin-top: 6px">Private, on‑device emotion estimation. Nothing sent without your consent.</div>
  </header>
  <main>
    <section class="card panel">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls">
        <button id="toggle">Start</button>
        <label>
          Sampling (ms)
          <select id="interval">
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
            <option value="2000">2000</option>
            <option value="5000">5000</option>
          </select>
        </label>
        <button id="log">Send to server</button>
        <label style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="autoLog" /> Auto log
        </label>
        <span id="status" style="color: var(--muted)">Idle</span>
      </div>
      <div class="kpis">
        <div class="kpi"><h3>Dominant</h3><div class="val" id="dominant">—</div></div>
        <div class="kpi"><h3>Confidence</h3><div class="val" id="conf">—</div></div>
        <div class="kpi"><h3>Samples (1h)</h3><div class="val" id="samples">0</div></div>
      </div>
    </section>
    <section class="card panel">
      <canvas id="chart" height="220"></canvas>
    </section>
  </main>
  <footer>
    Built with face‑api.js + FastAPI. Video never leaves your device unless you press Send.
  </footer>
</body>
</html>
